[project]
name = "research-workbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "paramiko>=3.5,<5",
  "pdfplumber>=0.11,<1", "pypdfium2>=4.30,<6", "defusedxml>=0.7,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<9"]
[tool.setuptools.packages.find]
include = ["backend*", "runner*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
